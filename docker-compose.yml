services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimback
      POSTGRES_PASSWORD: claimback
      POSTGRES_DB: claimback
    # 55432 on the host: 5432/5433 are often taken by local Postgres installs
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
